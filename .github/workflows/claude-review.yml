# Claude reviews every PR once when it opens or is marked ready.
# Push more commits and want another pass? Comment "@claude review again".
name: Claude PR review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to ClipEngine. Read CLAUDE.md first and follow the
            checklist in .claude/agents/reviewer.md: correctness, missing tests, rule breaks,
            and per-frame performance. Skip style nitpicks.

            Put each concrete problem as an inline comment on the line with
            mcp__github_inline_comment__create_inline_comment. Then leave one short summary
            comment with `gh pr comment`: what the PR does, the top risks, and whether
            it looks ready to merge. If there is nothing to fix, say so in one line.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

# Run this from the Actions tab when a visual change is intended, or when the
# screenshot baselines need to be regenerated on GitHub's Linux runners.
name: Update screenshot baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/visual.spec.js --update-snapshots
      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "test: update screenshot baselines"
          git push
